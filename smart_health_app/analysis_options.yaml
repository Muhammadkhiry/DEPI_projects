# Task 1.1: team lint rules. Requires `very_good_analysis` in dev_dependencies
# (added by scripts/add_packages.ps1). Run `flutter pub get` first.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/firebase_options.dart

linter:
  rules:
    # Too noisy for a student/team app; keep the rest of the strict rules.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    flutter_style_todos: false
    # The codebase already uses relative imports in places; allow both for now.
    always_use_package_imports: false
